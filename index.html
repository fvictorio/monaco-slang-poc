<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monaco + Slang PoC</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100vh;
        overflow: hidden;
      }
      #sidebar {
        border-right: 1px solid #ddd;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #sidebar-header {
        flex: 0 0 auto;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #sidebar-header h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        color: #666;
        margin: 0;
      }
      #upload-btn {
        font-size: 0.85rem;
        padding: 0.4rem 0.6rem;
        cursor: pointer;
        background: white;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      #upload-btn:hover {
        background: #eee;
      }
      #upload-error {
        font-size: 0.75rem;
        color: #b00;
        word-break: break-word;
      }
      #file-list {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .file-item {
        padding: 0.4rem 1rem;
        cursor: pointer;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-item:hover {
        background: #e8e8e8;
      }
      .file-item.active {
        background: #007acc;
        color: white;
      }
      #editor {
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="sidebar-header">
          <h2>Files</h2>
          <button id="upload-btn" type="button">Upload solc-input.json</button>
          <input id="upload-input" type="file" accept="application/json,.json" hidden />
          <div id="upload-error" hidden></div>
        </div>
        <div id="file-list"></div>
      </aside>
      <main id="editor"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
